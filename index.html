*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{text-align:center;display:flex;flex-direction:column;align-items:center;gap:28px}
.logo{color:var(--ink);width:min(360px,80vw)}
.logo svg{width:100%;height:auto;display:block}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,44px);letter-spacing:.06em;text-transform:uppercase;margin:0}
